name: CI

# The jobs live in secured-ai/workflows and are pinned by commit SHA rather than
# by @main. A shared workflow is a supply chain concentration point: anyone who
# can push there would otherwise change CI here with no review in this
# repository. Dependabot raises the PR when it moves.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    uses: secured-ai/workflows/.github/workflows/node-suite.yml@cdcd70a91411a53f227c354e00de008cbd53c180
    with:
      node-versions: '["22.18","24"]'

  # The properties that keep this an assessment tool rather than an attack
  # tool, named one by one. Deleting a test is the cheapest way to stop it
  # failing, and this makes that as loud as breaking the behaviour.
  safety-rails:
    uses: secured-ai/workflows/.github/workflows/claims.yml@cdcd70a91411a53f227c354e00de008cbd53c180
    with:
      claims: |
        a config with no authorization block is refused
        the request budget is enforced
        a redirect off the authorised host is not followed
        secrets never reach the reply text
        a probe that throws is inconclusive, never failed
        inconclusive controls stay out of failed
        milestone one covers every required control
        the demo command accepts no target, so it cannot be aimed at anyone
        self-authorisation does not leak into the ordinary probe path
        the demo refuses to call a knowingly broken agent clean

  # The suite runs against the source tree. An installed copy differs in two
  # ways no test can see: Node refuses to strip types under node_modules, and
  # npm installs a bin as a symlink so argv[1] is not the module path. Either
  # one ships a package that fails on first use with CI fully green, and this
  # is the only job that would notice. It found exactly that in 0.1.0.
  packaged-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run smoke

  all-checks-passed:
    if: always()
    needs: [suite, safety-rails, packaged-install]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job must have succeeded
        run: |
          echo "suite:            ${{ needs.suite.result }}"
          echo "safety-rails:     ${{ needs['safety-rails'].result }}"
          echo "packaged-install: ${{ needs['packaged-install'].result }}"
          if [ "${{ needs.suite.result }}" != "success" ] || \
             [ "${{ needs['safety-rails'].result }}" != "success" ] || \
             [ "${{ needs['packaged-install'].result }}" != "success" ]; then
            echo "A required job did not succeed."
            exit 1
          fi
          echo "All required checks passed."
